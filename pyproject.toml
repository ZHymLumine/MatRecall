[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrecall"
version = "0.1.0"
description = "MatRecall: experience-grounded materials prediction with verified episodic memory"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "ase>=3.29",
  "dscribe>=2.1",
  "jarvis-tools>=2024.10",
  "jsonschema>=4",
  "numpy>=1.26",
  "pandas>=2",
  "pyarrow>=14",
  "pymatgen>=2025.10.7",
  "scikit-learn>=1.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]
alignn = ["alignn @ git+https://github.com/atomgptlab/alignn.git@7b3111906ca61f6c1659cdf3b4f19f87b9a57692"]

[tool.setuptools.packages.find]
where = ["."]
include = ["matrecall*"]

[tool.setuptools.package-data]
matrecall = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
